# The dsh-grok-leader bundle patch: the harness-side half of the leader
# profile. The real grok TUI connects to this server over the leader unix
# socket; the server drives the harness Agent/Session/llm services directly.
# No Host, HTTP server, or browser layer is mounted.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent. Your working directory is {{cwd}}.

# dscode is provider-neutral. A fresh profile starts with no provider or
# model; users add any route they want through /provider. Keep the default
# selection service mounted so later model/effort choices persist, but make
# its deployment fallback empty. The native DeepSeek route remains available
# as an add-provider preset rather than being silently preinstalled.
- id: agent-default-model
  config:
    provider: ''
    model: ''
- id: llm-deepseek
  disabled: true

# Long-lived server: no module-reload HMR.
- id: hmr
  disabled: true

# The session picker performs content search through x.ai/session/search.
# Open the disposable derived index lazily so startup stays warning-free and
# the first search reconciles both live and persisted dsh sessions.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search
# The agent plane moves behind agent presets: the base host registers
# the model-facing tools process-wide (single-session TUI layout); this
# profile is multi-session like the web surface, so the host tool rows are
# disabled here and each preset mounts its own catalog (mirrors
# upstream deepseek-harness/packages/bundle/web-app/cordis.patch.yml).
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
- id: command-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# Keep the released official presets and writable user root. The installed
# dscode bundle adds an opt-in history preset without changing standard.
- insert:
    # Host-owned subagent model selection sampled by preset-scoped tools.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # The shipped `ptc` preset needs the host-plane TypeScript runtime used by
    # dsh's headless and web profiles.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
        roots:
          - path: !!js dshHomePath('profiles/dscode/node_modules/@hqzhao95/dscode/presets')
            trust: system
        includeShippedRoot: true
        includeUserRoot: true

- insert:
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

- insert:
    - id: grok-leader
      name: '@hqzhao95/dscode'
      config:
        socketPath: !!js process.env.DSCODE_SOCKET
