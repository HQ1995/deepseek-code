# The dsh-grok-leader bundle patch: the harness-side half of the leader
# profile. The real grok TUI connects to this server over the leader unix
# socket; the server drives the harness Agent/Session/llm services directly.
# No Host, HTTP server, or browser layer is mounted.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# Long-lived server: no module-reload HMR.
- id: hmr
  disabled: true
# The agent plane moves behind agent presets: the base host registers
# the model-facing tools process-wide (single-session TUI layout); this
# profile is multi-session like the web surface, so the host tool rows are
# disabled here and each preset mounts its own catalog (mirrors
# upstream deepseek-harness/packages/bundle/web-app/cordis.patch.yml).
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# The preset roster, mirroring the web profile: the shipped preset root is
# patched in by apps/cli profile-boot (SHIPPED_PRESET_ROOT) because only the
# app can resolve its own config directory; the writable user root is the
# roster's own default.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: minimal

- insert:
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

- insert:
    - id: grok-leader
      name: '@hqzhao95/dscode'
      config:
        socketPath: !!js process.env.DSCODE_SOCKET
