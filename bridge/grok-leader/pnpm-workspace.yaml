packages:
  - .

# Peer deps (cordis/schemastery and every @deepseek-ai/dsh-*) are installed as
# devDependencies at the tested ^0.1.1-rc.2 package-family version, so this
# build uses only official npm packages.
autoInstallPeers: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-presets@0.1.1-rc.2'
  - '@deepseek-ai/dsh-agent@0.1.1-rc.2'
  - '@deepseek-ai/dsh-atomic-write@0.1.1-rc.2'
  - '@deepseek-ai/dsh-attachment@0.1.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.1.1-rc.2'
  - '@deepseek-ai/dsh-home-paths@0.1.1-rc.2'
  - '@deepseek-ai/dsh-invariants@0.1.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.1.1-rc.2'
  - '@deepseek-ai/dsh-scope@0.1.1-rc.2'
  - '@deepseek-ai/dsh-session-persistence@0.1.1-rc.2'
  - '@deepseek-ai/dsh-session@0.1.1-rc.2'
  - '@deepseek-ai/dsh-settings@0.1.1-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.1.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.1.1-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.1.1-rc.2'
  - '@deepseek-ai/dsh-user-approval@0.1.1-rc.2'
  - '@deepseek-ai/dsh-user-questions@0.1.1-rc.2'
