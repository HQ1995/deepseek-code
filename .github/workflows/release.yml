# macOS release binaries. scripts/release.sh (run locally) builds the Linux
# asset, creates the GitHub release, and publishes npm; pushing the tag
# triggers this workflow, which adds the macOS binaries to that release.
# workflow_dispatch backfills an existing release (e.g. tag: v0.0.6).
# Asset names follow xai-grok-update detect_platform: dscode-{os}-{arch}.
name: release-macos
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to backfill (e.g. v0.0.6)'
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both build on the arm64 runner: GitHub retired the free Intel
          # (macos-13) runners — their queue never advances. x86_64 is a
          # cross-compile (same Apple SDK, clang -arch handles it) and the
          # version check runs the produced binary under Rosetta.
          - { asset: dscode-macos-aarch64, target: aarch64-apple-darwin }
          - { asset: dscode-macos-x86_64, target: x86_64-apple-darwin }
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/grok-build
      - name: Build tools
        # xai-grok-tools-api build.rs needs protoc; the repo's bin/protoc is
        # a dotslash launcher that only works on the dev host.
        run: brew install protobuf
      - name: Build
        # cargo directly (not scripts/build-deepseek-tui.sh): backfills check
        # out old tags whose script may carry host-specific wrappers.
        run: |
          VERSION="${TAG#v}"
          rustup target add ${{ matrix.target }}
          ( cd third_party/grok-build && GROK_VERSION="$VERSION" cargo build --release -p xai-grok-pager-bin --target ${{ matrix.target }} )
          banner="$(third_party/grok-build/target/${{ matrix.target }}/release/dscode --version)"
          echo "binary: $banner"
          case "$banner" in *"$VERSION"*) ;; *) echo "version mismatch" >&2; exit 1 ;; esac
      - name: Stage
        run: |
          mkdir -p dist
          cp "third_party/grok-build/target/${{ matrix.target }}/release/dscode" "dist/${{ matrix.asset }}"
          ( cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256" )
          cat "dist/${{ matrix.asset }}.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/release.sh creates the release moments after pushing the
          # tag; wait for it rather than racing it.
          for i in $(seq 1 40); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG ($i)"; sleep 15
          done
          gh release upload "$TAG" \
            "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" --clobber
