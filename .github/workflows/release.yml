# Native TUI binaries for every supported OS. scripts/release.sh creates the
# draft GitHub release with plugin and license assets; this workflow is the
# sole uploader for platform binaries and checksums, avoiding clobber races.
# workflow_dispatch backfills an existing release (e.g. tag: v0.0.10).
# Asset names follow xai-grok-update detect_platform: dscode-{os}-{arch}.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to backfill (e.g. v0.0.10)'
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, asset: dscode-linux-x86_64, target: x86_64-unknown-linux-gnu }
          # Apple Silicon only: GitHub retired the free Intel runners, and
          # Intel-mac support is explicitly out of scope.
          - { os: macos-latest, asset: dscode-macos-aarch64, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/grok-build
      - name: Install dotslash
        # bin/protoc is a checked, cross-platform DotSlash launcher pinned to
        # protoc 29.3. Avoid distro protobuf versions, which differ by runner.
        run: cargo install --locked dotslash --version 0.5.7
      - name: Build
        # cargo directly (not scripts/build-deepseek-tui.sh): backfills check
        # out old tags whose script may carry host-specific wrappers.
        run: |
          VERSION="${TAG#v}"
          rustup target add ${{ matrix.target }}
          ( cd third_party/grok-build && GROK_VERSION="$VERSION" cargo build --release -p xai-grok-pager-bin --target ${{ matrix.target }} )
          banner="$(third_party/grok-build/target/${{ matrix.target }}/release/dscode --version)"
          echo "binary: $banner"
          case "$banner" in *"$VERSION"*) ;; *) echo "version mismatch" >&2; exit 1 ;; esac
      - name: Stage
        run: |
          mkdir -p dist
          cp "third_party/grok-build/target/${{ matrix.target }}/release/dscode" "dist/${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256" )
          else
            ( cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256" )
          fi
          gzip -9 -c "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.gz"
          ls -lh "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.gz"
          cat "dist/${{ matrix.asset }}.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/release.sh creates the release moments after pushing the
          # tag; wait for it rather than racing it.
          for i in $(seq 1 40); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG ($i)"; sleep 15
          done
          gh release upload "$TAG" \
            "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" \
            "dist/${{ matrix.asset }}.gz" --clobber
