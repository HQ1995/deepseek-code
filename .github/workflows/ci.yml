# Dual-platform PR checks. Bridge validation consumes the same pinned source
# SDK/runtime as releases; the unpublished SDK family is never resolved from npm.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the product version for all Rust checks and builds
        run: echo "GROK_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Install source runtime toolchains
        run: |
          npm install --global corepack
          corepack enable
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y musl-tools libevent-dev libncurses-dev; fi
      - name: Install tmux with OSC 8 support
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 https://github.com/tmux/tmux/releases/download/3.4/tmux-3.4.tar.gz -o "$RUNNER_TEMP/tmux-3.4.tar.gz"
          echo "551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa  $RUNNER_TEMP/tmux-3.4.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tmux-3.4.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.4"
          ./configure --prefix="$RUNNER_TEMP/tmux"
          make -j2
          make install
          echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - name: Scripts (bash 3.2-safe on macOS)
        run: |
          bash scripts/check.sh
          node --test scripts/release-payload.test.mjs
      - name: Build pinned source SDK and runtime
        run: |
          node scripts/build-release-payload.mjs --out "$RUNNER_TEMP/dscode-payload"
          mkdir -p "$RUNNER_TEMP/dscode-runtime"
          tar -xzf "$RUNNER_TEMP"/dscode-payload/dscode-runtime-*.tar.gz -C "$RUNNER_TEMP/dscode-runtime"
          ln -s "$RUNNER_TEMP/dscode-runtime/node_modules" bridge/grok-leader/node_modules
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/grok-build
          cache-on-failure: true
      - name: Install dotslash
        run: cargo install --locked dotslash --version 0.5.7
      - name: Rust product contracts
        run: bash scripts/check-rust.sh
      - name: Build product TUI
        run: bash scripts/build-deepseek-tui.sh
      - name: Bridge tests
        working-directory: bridge/grok-leader
        env:
          DSCODE_E2E_DSH_BIN: ${{ runner.temp }}/dscode-runtime/bin/dsh
          DSCODE_E2E_PLUGIN_TGZ: ${{ runner.temp }}/dscode-payload/dscode-plugin.tgz
          DSCODE_TUI_BIN: ${{ github.workspace }}/third_party/grok-build/target/release/dscode
        run: |
          # Use the exact source-built SDK, including its compiler and test runner.
          node node_modules/typescript/bin/tsc -b tsconfig.json
          node node_modules/vitest/vitest.mjs run --maxWorkers 2
      - name: Managed update E2E
        env:
          DSCODE_E2E_PLUGIN_TGZ: ${{ runner.temp }}/dscode-payload/dscode-plugin.tgz
          DSCODE_E2E_OUT_DIR: ${{ runner.temp }}/dscode-update-e2e
          DSCODE_TUI_BIN: ${{ github.workspace }}/third_party/grok-build/target/release/dscode
        run: |
          export DSCODE_E2E_RUNTIME_TGZ="$(echo "$RUNNER_TEMP"/dscode-payload/dscode-runtime-*.tar.gz)"
          node scripts/e2e-update.mjs
      - name: Install LSP fixture
        if: runner.os == 'Linux'
        run: npm install --global typescript@6.0.3 typescript-language-server@5.0.0
      - name: Real TUI and runtime E2E
        if: runner.os == 'Linux'
        env:
          DSCODE_E2E_DSH_BIN: ${{ runner.temp }}/dscode-runtime/bin/dsh
          DSCODE_E2E_PLUGIN_TGZ: ${{ runner.temp }}/dscode-payload/dscode-plugin.tgz
          DSCODE_E2E_OUT_DIR: ${{ runner.temp }}/dscode-e2e
          DSCODE_TUI_BIN: ${{ github.workspace }}/third_party/grok-build/target/release/dscode
        run: bash scripts/e2e-tui-bridge.sh
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: product-e2e
          path: ${{ runner.temp }}/dscode-e2e
