# Dual-platform PR checks. Compile the TUI only on tagged releases
# (.github/workflows/release.yml); this job is the cheap gate that catches
# Linux vs macOS script/launcher drift without bouncing machines.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Scripts (bash 3.2-safe on macOS)
        run: bash scripts/check.sh
      - name: Bridge tests
        working-directory: bridge/grok-leader
        run: |
          pnpm install --frozen-lockfile
          # vitest transpiles without type-checking, so a PR can ship type
          # errors that only surface at publish. Compile the bridge here too;
          # this is the same `tsc -b` scripts/release.sh runs before publish.
          pnpm exec tsc -b tsconfig.json
          pnpm exec vitest run
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/grok-build
      - name: Install dotslash
        # bin/protoc is a checked, cross-platform DotSlash launcher pinned to
        # protoc 29.3. Avoid distro protobuf versions, which differ by runner.
        run: cargo install --locked dotslash --version 0.5.7
      - name: Check dscode TUI
        working-directory: third_party/grok-build
        run: cargo check -p xai-grok-pager-bin
      - name: Test leader protocol gate
        working-directory: third_party/grok-build
        run: cargo test -p xai-grok-shell wrong_protocol_version_fails_registration --lib
      - name: Test TUI CLI metadata contracts
        # Release-only E2E runs the full `to_meta_` suite (e2e-product.sh
        # [4/5]); surface it on every PR so CLI/contract drift is caught
        # before a tag, not by the release pipeline.
        working-directory: third_party/grok-build
        run: cargo test --manifest-path crates/codegen/xai-grok-pager/Cargo.toml to_meta_
