# Dual-platform PR checks. Bridge validation consumes the same pinned source
# SDK/runtime as releases; the unpublished SDK family is never resolved from npm.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source runtime toolchains
        run: |
          npm install --global corepack
          corepack enable
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi
      - name: Scripts (bash 3.2-safe on macOS)
        run: bash scripts/check.sh
      - name: Build pinned source SDK and runtime
        run: |
          node scripts/build-release-payload.mjs --out "$RUNNER_TEMP/dscode-payload"
          mkdir -p "$RUNNER_TEMP/dscode-runtime"
          tar -xzf "$RUNNER_TEMP"/dscode-payload/dscode-runtime-*.tar.gz -C "$RUNNER_TEMP/dscode-runtime"
          ln -s "$RUNNER_TEMP/dscode-runtime/node_modules" bridge/grok-leader/node_modules
      - name: Bridge tests
        working-directory: bridge/grok-leader
        env:
          DSCODE_E2E_DSH_BIN: ${{ runner.temp }}/dscode-runtime/bin/dsh
          DSCODE_E2E_PLUGIN_TGZ: ${{ runner.temp }}/dscode-payload/dscode-plugin.tgz
        run: |
          # Use the exact source-built SDK, including its compiler and test runner.
          node node_modules/typescript/bin/tsc -b tsconfig.json
          node node_modules/vitest/vitest.mjs run
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/grok-build
      - name: Install dotslash
        # bin/protoc is a checked, cross-platform DotSlash launcher pinned to
        # protoc 29.3. Avoid distro protobuf versions, which differ by runner.
        run: cargo install --locked dotslash --version 0.5.7
      - name: Check dscode TUI
        working-directory: third_party/grok-build
        run: cargo check -p xai-grok-pager-bin
      - name: Test leader protocol gate
        working-directory: third_party/grok-build
        run: cargo test -p xai-grok-shell wrong_protocol_version_fails_registration --lib
      - name: Test TUI CLI metadata contracts
        # Release-only E2E runs the full `to_meta_` suite (e2e-product.sh
        # [4/5]); surface it on every PR so CLI/contract drift is caught
        # before a tag, not by the release pipeline.
        working-directory: third_party/grok-build
        run: cargo test --manifest-path crates/codegen/xai-grok-pager/Cargo.toml to_meta_
