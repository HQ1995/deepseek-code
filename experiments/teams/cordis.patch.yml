# Install only in a dedicated, fresh DSH_HOME. Never migrate existing non-Team sessions.
# The native Team runtime is process-owned; exactly one roster/tool owner. Row ids
# match upstream @deepseek-ai/dsh-experimental-agent-team-profile, whose Web UI
# row a TUI host does not need.
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

# Teams is the only mode: the dscode preset rows stay declared but unmounted,
# so no session can select a preset with legacy delegation beside Team tools.
- id: agent-preset-registry
  config:
    default: teams
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-history
  disabled: true
- id: preset-lsp
  disabled: true
- id: preset-terminal
  disabled: true
