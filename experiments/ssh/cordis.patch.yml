# Remote-provider composition. Use a separate profile, never an existing local Session store.
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- id: ptc-runtime
  disabled: true
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js JSON.parse(process.env.DSCODE_SSH_CONFIG).workspace
- insert:
    - id: dscode-experimental-ssh
      name: '@hqzhao95/dscode-experimental-ssh'
      config: !!js JSON.parse(process.env.DSCODE_SSH_CONFIG)
# Until remote path opening is wired through the pager, do not expose a local
# TUI that might open a remote path on the Mac. SDK/headless consumers are safe.
- id: grok-leader
  disabled: true
