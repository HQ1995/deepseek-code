# Only for the loopback acceptance fixture; not a deployment overlay.
- id: session-title-llm
  disabled: true
- id: tools
  config:
    mode: native
- id: approval
  config:
    policy: never
# DSH 0.1.7 refuses to start permission presets when the composed sandbox and
# approval defaults match no preset. An id patch replaces the whole config, so
# the base presets are restated beside the fixture-only automatic one.
- id: permission
  config:
    defaultPreset: acceptance-workspace-auto
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      acceptance-workspace-auto:
        sandbox: workspace-write
        approval: never
